<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cascade · pipeline console</title>
<style>
  :root {
    --bg:#0b0e13; --panel:#12171f; --raised:#19202b; --line:#232c3a; --line-strong:#313d50;
    --text:#e7edf6; --muted:#8a9ab0; --dim:#5f6d82;
    --ok:#4ade9b; --warn:#e8b339; --bad:#f2545b; --accent:#6aa2ff;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme=dark]) {
      --bg:#f5f7fa; --panel:#fff; --raised:#fff; --line:#e3e8ef; --line-strong:#cbd5e1;
      --text:#0f172a; --muted:#516078; --dim:#7c8aa0; --ok:#0f9960; --accent:#2563eb;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;background:var(--bg);z-index:5}
  .brand{font-weight:650;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
  .mark{width:22px;height:22px;border-radius:7px;background:linear-gradient(140deg,var(--ok),var(--accent))}
  .spacer{flex:1}
  input,button{font:inherit;font-family:var(--mono);font-size:12.5px}
  input{background:var(--raised);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 10px;outline:none;width:180px}
  button{background:var(--raised);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 12px;cursor:pointer}
  button:hover{border-color:var(--line-strong)}
  main{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px 16px}
  .stat .k{font-size:12px;color:var(--muted);margin-bottom:5px}
  .stat .v{font-size:23px;font-weight:600;font-family:var(--mono);letter-spacing:-.02em}
  .tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
  .tabs button.on{border-color:var(--accent);color:var(--accent)}
  section{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:4px 16px 12px;overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--dim);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 8px;white-space:nowrap}
  td{padding:10px;border-top:1px solid var(--line);white-space:nowrap}
  td.mono,th.mono{font-family:var(--mono)}
  tr:hover td{background:var(--raised)}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;border:1px solid var(--line-strong);font-size:11.5px;font-family:var(--mono)}
  .pill.new{color:var(--muted)} .pill.qualified{color:var(--accent);border-color:var(--accent)}
  .pill.contacted{color:var(--warn);border-color:var(--warn)} .pill.replied,.pill.won{color:var(--ok);border-color:var(--ok)}
  .pill.rejected,.pill.lost{color:var(--bad);border-color:var(--bad)}
  .score{font-family:var(--mono);font-weight:600}
  .consent-none{color:var(--bad)} .consent-explicit{color:var(--ok)} .consent-inbound_message{color:var(--warn)}
  .empty{color:var(--dim);padding:18px 10px}
  .err{color:var(--bad);padding:10px}
  @media (max-width:640px){ input{width:120px} }
</style>
</head>
<body>
<header>
  <span class="brand"><span class="mark"></span> Cascade</span>
  <span class="spacer"></span>
  <input id="key" placeholder="API key" autocomplete="off" />
  <button id="refresh">Refresh</button>
</header>

<main>
  <div class="stats" id="stats"></div>
  <div class="tabs">
    <button data-view="leads" class="on">Leads</button>
    <button data-view="posts">Posts</button>
    <button data-view="messages">Messages</button>
    <button data-view="audit">Audit</button>
  </div>
  <section id="panel"><div class="empty">Loading…</div></section>
</main>

<script>
const $ = (selector) => document.querySelector(selector);
const state = { view: "leads", key: localStorage.getItem("cascade-key") || "" };
$("#key").value = state.key;

const api = async (path) => {
  const response = await fetch(path, { headers: { "x-cascade-key": state.key } });
  if (response.status === 401) throw new Error("Unauthorised: check the API key");
  if (!response.ok) throw new Error(`${path} returned ${response.status}`);
  return response.json();
};

const ago = (seconds) => {
  if (!seconds) return "—";
  const delta = Math.max(0, Math.floor(Date.now() / 1000) - Number(seconds));
  if (delta < 60) return delta + "s";
  if (delta < 3600) return Math.floor(delta / 60) + "m";
  if (delta < 86400) return Math.floor(delta / 3600) + "h";
  return Math.floor(delta / 86400) + "d";
};

// The 24 hour window is the number an operator actually needs on screen: after it closes,
// only a template can be sent, so a lead about to expire is a lead to answer now.
const windowLeft = (lastInboundAt) => {
  if (!lastInboundAt) return "closed";
  const remaining = Number(lastInboundAt) + 86400 - Math.floor(Date.now() / 1000);
  if (remaining <= 0) return "closed";
  return Math.floor(remaining / 3600) + "h " + Math.floor((remaining % 3600) / 60) + "m";
};

const table = (columns, rows, render) => {
  if (!rows.length) return '<div class="empty">Nothing here yet.</div>';
  return `<table><thead><tr>${columns.map((c) => `<th>${c}</th>`).join("")}</tr></thead>
    <tbody>${rows.map((row) => `<tr>${render(row).map((cell) => `<td>${cell}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
};

const views = {
  async leads() {
    const { leads } = await api("/api/leads");
    return table(
      ["Lead", "Source", "Score", "Stage", "Consent", "WhatsApp window", "Updated"],
      leads,
      (lead) => [
        `${lead.name || lead.ig_username || "—"}<br><span class="mono" style="color:var(--dim);font-size:11.5px">${lead.phone || "no phone"}</span>`,
        lead.source,
        `<span class="score">${lead.score}</span>`,
        `<span class="pill ${lead.stage}">${lead.stage}</span>`,
        `<span class="consent-${lead.consent}">${lead.consent}</span>`,
        lead.opted_out_at ? '<span class="consent-none">opted out</span>' : windowLeft(lead.last_inbound_at),
        ago(lead.updated_at),
      ]
    );
  },
  async posts() {
    const { posts } = await api("/api/posts");
    return table(["Post", "Kind", "Status", "Permalink", "Created"], posts, (post) => [
      `<span class="mono">${post.idempotency_key}</span><br><span style="color:var(--dim)">${(post.caption || "").slice(0, 60)}</span>`,
      post.kind,
      `<span class="pill ${post.status === "published" ? "won" : post.status === "failed" ? "rejected" : "new"}">${post.status}</span>`,
      post.permalink ? `<a href="${post.permalink}" style="color:var(--accent)">open</a>` : "—",
      ago(post.created_at),
    ]);
  },
  async messages() {
    const { messages } = await api("/api/messages");
    return table(["Direction", "Contact", "Body", "Template", "Status", "When"], messages, (message) => [
      message.direction === "in" ? "← in" : "→ out",
      `<span class="mono">${message.phone || message.ig_username || "—"}</span>`,
      (message.body || "").slice(0, 70) || "—",
      message.template || "—",
      `<span class="pill ${message.status === "failed" ? "rejected" : message.status === "delivered" || message.status === "read" ? "won" : "new"}">${message.status}</span>`,
      ago(message.created_at),
    ]);
  },
  async audit() {
    const { entries } = await api("/api/audit");
    return table(["Action", "Actor", "Subject", "Detail", "When"], entries, (entry) => [
      `<span class="mono">${entry.action}</span>`,
      entry.actor,
      entry.subject || "—",
      `<span style="color:var(--dim)">${(entry.detail || "").slice(0, 80)}</span>`,
      ago(entry.at),
    ]);
  },
};

async function render() {
  try {
    const stats = await api("/api/stats");
    $("#stats").innerHTML = [
      ["Leads", stats.leads],
      ["Qualified", stats.qualified],
      ["Contacted", stats.contacted],
      ["Posts today", stats.postsPublishedToday],
      ["IG quota left", stats.instagramQuotaRemaining],
      ["Jobs pending", stats.jobsPending],
      ["Jobs dead", stats.jobsDead],
    ]
      .map(([k, v]) => `<div class="stat"><div class="k">${k}</div><div class="v" ${k === "Jobs dead" && v > 0 ? 'style="color:var(--bad)"' : ""}>${v}</div></div>`)
      .join("");
    $("#panel").innerHTML = await views[state.view]();
  } catch (error) {
    $("#panel").innerHTML = `<div class="err">${error.message}</div>`;
  }
}

document.querySelectorAll(".tabs button").forEach((button) => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".tabs button").forEach((other) => other.classList.remove("on"));
    button.classList.add("on");
    state.view = button.dataset.view;
    render();
  });
});
$("#key").addEventListener("change", (event) => {
  state.key = event.target.value.trim();
  localStorage.setItem("cascade-key", state.key);
  render();
});
$("#refresh").addEventListener("click", render);
setInterval(render, 20000);
render();
</script>
</body>
</html>
